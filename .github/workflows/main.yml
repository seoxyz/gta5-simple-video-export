name: Build SimpleVideoExport (FFmpeg 5.1/6.1 + QSV)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg (Commit FFmpeg Compatible)
        shell: cmd
        run: |
          cd /d C:\vcpkg
          git fetch --unshallow || git fetch
          git checkout 501db0f17ef6df184fcdbfbe0f87cde2313b6ab1
          .\bootstrap-vcpkg.bat -disableMetrics
          echo set(VCPKG_BUILD_TYPE release)>> C:\vcpkg\triplets\community\x64-windows-static-md.cmake
          .\vcpkg integrate install

      - name: Download 7z2107-extra.7z from official 7-Zip GitHub
        shell: cmd
        run: |
          if not exist C:\vcpkg\downloads mkdir C:\vcpkg\downloads
          curl -L -o C:\vcpkg\downloads\7z2107-extra.7z https://github.com

      - name: Install dependencies (Release Only + Intel QSV)
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows-static-md spdlog asmjit asmtk polyhook2[core,pe,virtuals] ffmpeg[core,avformat,avcodec,swresample,swscale,qsv,zlib]

      - name: Build .asi with Ninja
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RELEASE -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md ..
          ninja

      - name: Generate Standalone VS2022 Project
        shell: cmd
        run: |
          mkdir vs2022_standalone\deps
          xcopy /E /I /Y C:\vcpkg\installed\x64-windows-static-md vs2022_standalone\deps
          cd vs2022_standalone
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%CD%\deps" ..

      - name: Package Outputs
        shell: cmd
        run: |
          mkdir output_asi
          copy build\*.asi output_asi\
          copy build\*.exe output_asi\
          copy plugin\*.ini output_asi\
          copy test\*.ini output_asi\

      - name: Upload Ready-to-Use .asi
        uses: actions/upload-artifact@v4
        with:
          name: 1-SimpleVideoExport-QSV-ASI
          path: output_asi/

      - name: Upload Standalone VS2022 Project
        uses: actions/upload-artifact@v4
        with:
          name: 2-Project-VS2022-QSV
          path: |
            common/
            plugin/
            test/
            CMakeLists.txt
            vs2022_standalone/
