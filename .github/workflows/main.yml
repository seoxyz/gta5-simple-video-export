name: Build SimpleVideoExport (Fast Prebuilt FFmpeg 5.1)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PolyHook2 repository
        uses: actions/checkout@v4
        with:
          repository: stevemk14ebr/PolyHook_2_0
          submodules: recursive
          path: polyhook2_src

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Prebuilt FFmpeg 5.1.2 (3 Seconds!)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "deps" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2024-12-31-13-02/ffmpeg-n5.1.6-11-gcde3c5fc0c-win64-lgpl-shared-5.1.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp"
          $ffDir = Get-ChildItem "ffmpeg_tmp" | Select-Object -First 1
          Copy-Item "$($ffDir.FullName)\include" -Destination "deps\include" -Recurse -Force
          Copy-Item "$($ffDir.FullName)\lib" -Destination "deps\lib" -Recurse -Force
          Copy-Item "$($ffDir.FullName)\bin\*.dll" -Destination "deps\bin" -Recurse -Force

      - name: Install spdlog via vcpkg (10 Seconds!)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "custom-triplets" | Out-Null
          Set-Content -Path "custom-triplets\x64-windows-static-md.cmake" -Value "set(VCPKG_TARGET_ARCHITECTURE x64)`nset(VCPKG_CRT_LINKAGE dynamic)`nset(VCPKG_LIBRARY_LINKAGE static)`nset(VCPKG_BUILD_TYPE release)"
          C:\vcpkg\vcpkg.exe install spdlog:x64-windows-static-md --overlay-triplets=custom-triplets --x-install-root=vcpkg_spdlog
          Copy-Item "vcpkg_spdlog\x64-windows-static-md\*" -Destination "deps" -Recurse -Force
      
      - name: Build & Install PolyHook2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $deps = Join-Path $root "deps"
          $build = Join-Path $root "polyhook2_src/build"

          # Ensure dependency directories exist
          foreach ($dir in @("bin", "lib", "include")) {
              $path = Join-Path $deps $dir

              if (Test-Path $path -PathType Leaf) {
                  Remove-Item $path -Force
              }

              New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          # Configure
          cmake -S "$root/polyhook2_src" -B "$build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$deps" `
            -DPOLYHOOK_BUILD_DLL=OFF `
            -DPOLYHOOK_FEATURE_DETOURS=OFF `
            -DPOLYHOOK_FEATURE_EXCEPTION=OFF `
            -DPOLYHOOK_FEATURE_INLINENTD=OFF `
            -DPOLYHOOK_FEATURE_PE=ON `
            -DPOLYHOOK_FEATURE_VIRTUALS=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

          if ($LASTEXITCODE -ne 0) {
              throw "PolyHook2 CMake configure failed"
          }

          # Build
          cmake --build "$build" --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
              throw "PolyHook2 build failed"
          }

          # Verify directories immediately before installation
          Write-Host "=== Checking installation directories ==="

          Get-Item "$deps/bin" | Format-List FullName, Attributes, PSIsContainer
          Get-Item "$deps/lib" | Format-List FullName, Attributes, PSIsContainer

          # Install
          cmake --install "$build" --config Release --prefix "$deps"

          if ($LASTEXITCODE -ne 0) {
              throw "PolyHook2 installation failed"
          }

          Write-Host "PolyHook2 installed successfully!"
          Get-ChildItem "$deps/lib"

      - name: Debug PolyHook2 CMake Targets
        shell: pwsh
        run: |
          Write-Host "=== PolyHook2 files ==="

          Get-ChildItem "deps/lib/PolyHook_2" -Recurse |
            Select-Object FullName

          Write-Host "=== Config file ==="

          Get-Content "deps/lib/PolyHook_2/polyhook_2-config.cmake"

          Write-Host "=== Target declarations ==="

          Get-ChildItem "deps/lib/PolyHook_2" -Filter "*.cmake" |
            Select-String -Pattern "add_library|IMPORTED|include"

      - name: Inspect PolyHook2 Imported Target
        shell: pwsh
        run: |
          Get-Content "deps/lib/PolyHook_2/PolyHook_2-targets.cmake" |
            Select-String -Pattern "add_library|IMPORTED"
      
      - name: Create FindFFMPEG Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "cmake" | Out-Null

          @'
          set(FFMPEG_ROOT "${CMAKE_CURRENT_LIST_DIR}/../deps")

          find_path(FFMPEG_INCLUDE_DIR
              libavcodec/avcodec.h
              PATHS "${FFMPEG_ROOT}/include"
              NO_DEFAULT_PATH
          )

          set(FFMPEG_LIBRARIES "")

          foreach(lib avcodec avformat avutil swresample swscale)
              find_library(FFMPEG_${lib}_LIBRARY
                  NAMES ${lib}
                  PATHS "${FFMPEG_ROOT}/lib"
                  NO_DEFAULT_PATH
              )

              if(FFMPEG_${lib}_LIBRARY)
                  list(APPEND FFMPEG_LIBRARIES
                      "${FFMPEG_${lib}_LIBRARY}")
              endif()
          endforeach()

          include(FindPackageHandleStandardArgs)

          find_package_handle_standard_args(FFMPEG
              REQUIRED_VARS
                  FFMPEG_INCLUDE_DIR
                  FFMPEG_avcodec_LIBRARY
                  FFMPEG_avformat_LIBRARY
                  FFMPEG_avutil_LIBRARY
                  FFMPEG_swresample_LIBRARY
                  FFMPEG_swscale_LIBRARY
          )

          set(FFMPEG_INCLUDE_DIRS "${FFMPEG_INCLUDE_DIR}")

          if(FFMPEG_FOUND AND NOT TARGET FFMPEG::FFMPEG)
              add_library(FFMPEG::FFMPEG INTERFACE IMPORTED)
              set_target_properties(FFMPEG::FFMPEG PROPERTIES
                  INTERFACE_INCLUDE_DIRECTORIES "${FFMPEG_INCLUDE_DIRS}"
                  INTERFACE_LINK_LIBRARIES "${FFMPEG_LIBRARIES}"
              )
          endif()
          '@ | Set-Content "cmake/FindFFMPEG.cmake"

          Write-Host "FindFFMPEG.cmake created"

      - name: Create FFmpeg CMake Finder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "cmake" | Out-Null

          @'
          set(FFMPEG_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../deps/include")

          set(FFMPEG_LIBRARY_DIRS "${CMAKE_CURRENT_LIST_DIR}/../deps/lib")

          set(FFMPEG_LIBRARIES
              avcodec
              avformat
              avutil
              swresample
              swscale
          )

          foreach(lib IN LISTS FFMPEG_LIBRARIES)
              find_library(FFMPEG_${lib}_LIBRARY
                  NAMES ${lib}
                  PATHS "${FFMPEG_LIBRARY_DIRS}"
                  NO_DEFAULT_PATH
                  REQUIRED
              )
          endforeach()

          set(FFMPEG_FOUND TRUE)
          '@ | Set-Content -Path "cmake/FindFFMPEG.cmake"

      - name: Build .asi with Ninja
        shell: pwsh
        run: |
          if (Test-Path "build") {
              Remove-Item "build" -Recurse -Force
          }

          $root = (Get-Location).Path.Replace('\', '/')

          New-Item -ItemType Directory -Force "build" | Out-Null

          cmake -S "$root" -B "$root/build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$root/deps" `
            "-DCMAKE_MODULE_PATH=$root/cmake"

          if ($LASTEXITCODE -ne 0) {
              exit 1
          }

          cmake --build "$root/build" --parallel

          if ($LASTEXITCODE -ne 0) {
              exit 1
          }

      - name: Generate Standalone VS2022 Project
        shell: cmd
        run: |
          mkdir vs2022_standalone
          cd vs2022_standalone
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%CD%\..\deps" -DFFMPEG_INCLUDE_DIRS="%CD%\..\deps\include" -DFFMPEG_LIBRARY_DIRS="%CD%\..\deps\lib" -DFFMPEG_LIBRARIES="avcodec;avformat;avutil;swresample;swscale" ..

      - name: Package Outputs
        shell: cmd
        run: |
          mkdir output_asi
          copy build\*.asi output_asi\
          copy build\*.exe output_asi\
          copy deps\bin\*.dll output_asi\
          copy plugin\*.ini output_asi\
          copy test\*.ini output_asi\

      - name: Upload Ready-to-Use .asi
        uses: actions/upload-artifact@v4
        with:
          name: 1-SimpleVideoExport-QSV-ASI
          path: output_asi/

      - name: Upload Standalone VS2022 Project
        uses: actions/upload-artifact@v4
        with:
          name: 2-Project-VS2022-QSV
          path: |
            common/
            plugin/
            test/
            deps/
            CMakeLists.txt
            vs2022_standalone/
