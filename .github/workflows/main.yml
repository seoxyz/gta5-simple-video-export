name: Build SimpleVideoExport (FFmpeg 5.1 + QSV)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Custom Triplet (Release Only + CMake 4 Fix) & Manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "custom-triplets" | Out-Null
          $triplet = @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_BUILD_TYPE release)
          set(VCPKG_CMAKE_CONFIGURE_OPTIONS "-DCMAKE_POLICY_VERSION_MINIMUM=3.5")
          '@
          Set-Content -Path "custom-triplets\x64-windows-static-md.cmake" -Value $triplet

          $manifest = @'
          {
            "name": "simple-video-export",
            "version": "1.0.0",
            "builtin-baseline": "501db0f17ef6df184fcdbfbe0f87cde2313b6ab1",
            "dependencies": [
              "spdlog",
              "asmjit",
              "asmtk",
              {
                "name": "polyhook2",
                "default-features": false,
                "features": ["pe", "virtuals"]
              },
              {
                "name": "ffmpeg",
                "default-features": false,
                "features": ["avformat", "avcodec", "swresample", "swscale", "qsv"]
              }
            ]
          }
          '@
          Set-Content -Path "vcpkg.json" -Value $manifest

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-ffmpeg51-qsv-${{ hashFiles('vcpkg.json', 'custom-triplets/x64-windows-static-md.cmake') }}

      - name: Install dependencies (Release Only + FFmpeg 5.1.2 + QSV)
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows-static-md --overlay-triplets=custom-triplets --x-install-root=C:\vcpkg\installed

      - name: Build .asi with Ninja
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RELEASE -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_OVERLAY_TRIPLETS="%CD%\..\custom-triplets" -DVCPKG_MANIFEST_MODE=OFF ..
          ninja

      - name: Generate Standalone VS2022 Project
        shell: cmd
        run: |
          mkdir vs2022_standalone\deps
          xcopy /E /I /Y C:\vcpkg\installed\x64-windows-static-md vs2022_standalone\deps
          cd vs2022_standalone
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%CD%\deps" ..

      - name: Package Outputs
        shell: cmd
        run: |
          mkdir output_asi
          copy build\*.asi output_asi\
          copy build\*.exe output_asi\
          copy plugin\*.ini output_asi\
          copy test\*.ini output_asi\

      - name: Upload Ready-to-Use .asi
        uses: actions/upload-artifact@v4
        with:
          name: 1-SimpleVideoExport-QSV-ASI
          path: output_asi/

      - name: Upload Standalone VS2022 Project
        uses: actions/upload-artifact@v4
        with:
          name: 2-Project-VS2022-QSV
          path: |
            common/
            plugin/
            test/
            CMakeLists.txt
            vs2022_standalone/
