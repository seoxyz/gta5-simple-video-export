name: Build SimpleVideoExport

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg at specific commit
        run: |
          git clone https://github.com C:\vcpkg
          cd C:\vcpkg
          git checkout 095ee8757ec933b22d445738d2dbb1ce89bb8021
          .\bootstrap-vcpkg.bat -disableMetrics
          echo set(VCPKG_BUILD_TYPE release)>> C:\vcpkg\triplets\community\x64-windows-static-md.cmake
          .\vcpkg integrate install

      - name: Install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows-static-md spdlog asmjit asmtk "polyhook2[core,pe,virtuals]" "ffmpeg[core,avformat,avcodec,swresample,swscale,nvcodec,mp3lame,opencl,openjpeg,opus,snappy,soxr,speex,theora,vorbis,vpx,webp,zlib]"

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RELEASE -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md ..
          ninja

      - name: Prepare Output Files
        run: |
          mkdir output
          copy build\*.asi output\
          copy build\*.exe output\
          copy plugin\*.ini output\
          copy test\*.ini output\

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVideoExport-Build
          path: output/
